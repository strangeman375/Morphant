name: Roslyn compatibility

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  test:
    name: Validate (Ubuntu, Roslyn ${{ matrix.roslyn }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.baseline && 35 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - roslyn: "4.4.0"
            baseline: true
          - roslyn: "4.9.2"
            baseline: false
          - roslyn: "5.9.0"
            baseline: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@349aa191ae05aee6d53db4bcba37bd6980e812fe # v6
        with:
          global-json-file: global.json

      - name: Test the shipped generator
        run: |
          test_options=()
          if [[ "${{ matrix.baseline }}" == "true" ]]; then
            test_options+=(--collect:"XPlat Code Coverage" --settings eng/coverlet.runsettings)
          fi
          bash eng/test-shipped-generator.sh "${{ matrix.roslyn }}" "${test_options[@]}"

      - name: Test integration scenarios
        if: ${{ matrix.baseline }}
        run: >-
          dotnet test src/tests/Morphant.Generator.IntegrationTests/Morphant.Generator.IntegrationTests.csproj
          --configuration Release
          --no-build
          --no-restore
          -p:MorphantRoslynVersion=${{ matrix.roslyn }}
          --collect:"XPlat Code Coverage"
          --settings eng/coverlet.runsettings
          --results-directory artifacts/test-results/integration
          --logger "trx;LogFileName=integration.trx"

      - name: Restore coverage report tool
        if: ${{ matrix.baseline }}
        run: dotnet tool restore

      - name: Create coverage report
        if: ${{ matrix.baseline }}
        run: |
          dotnet reportgenerator \
            "-reports:artifacts/test-results/*/*/coverage.cobertura.xml" \
            "-targetdir:artifacts/coverage" \
            "-reporttypes:Html;Cobertura;MarkdownSummaryGithub;Badges" \
            "-assemblyfilters:+Morphant;+Morphant.Generator;+Morphant.Build.Tasks"

      - name: Enforce coverage
        if: ${{ matrix.baseline }}
        run: |
          python3 eng/verify_coverage.py \
            artifacts/coverage/Cobertura.xml Morphant.Generator 85 75
          python3 eng/verify_coverage.py \
            artifacts/coverage/Cobertura.xml Morphant 75 75
          python3 eng/verify_coverage.py \
            artifacts/coverage/Cobertura.xml Morphant.Build.Tasks 50 40

      - name: Add coverage summary
        if: ${{ matrix.baseline }}
        run: cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-roslyn-${{ matrix.roslyn }}
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage report
        if: ${{ always() && matrix.baseline }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: artifacts/coverage
          if-no-files-found: warn
          retention-days: 30
