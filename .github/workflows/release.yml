name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version from Morphant.Product.props
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  preflight:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      commit: ${{ steps.metadata.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@bbbb8c9ab609f9ab643834ffe948a0f577bc4c0c # v6
        with:
          global-json-file: global.json

      - name: Validate source and version
        id: metadata
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be started from main." >&2
            exit 1
          fi

          if [[ "$REPOSITORY_VISIBILITY" != "public" ]]; then
            echo "The repository must be public before publication." >&2
            exit 1
          fi

          if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $REQUESTED_VERSION" >&2
            exit 1
          fi

          product_version="$(dotnet msbuild src/Morphant/Morphant.csproj -nologo -getProperty:Version)"

          if [[ "$REQUESTED_VERSION" != "$product_version" ]]; then
            echo "Requested version $REQUESTED_VERSION does not match product version $product_version." >&2
            exit 1
          fi

          awk -v heading="## [$product_version]" '
            $0 == heading { capture = 1; next }
            capture && /^## / { exit }
            capture && /^\[[^]]+\]:/ { exit }
            capture { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

          if [[ ! -s "$RUNNER_TEMP/release-notes.md" ]]; then
            echo "CHANGELOG.md has no release notes for $product_version." >&2
            exit 1
          fi

          if ! grep --fixed-strings --quiet "[$product_version]:" CHANGELOG.md; then
            echo "CHANGELOG.md has no link definition for $product_version." >&2
            exit 1
          fi

          echo "artifact_name=morphant-release-$product_version" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$product_version" >> "$GITHUB_OUTPUT"

  package:
    name: Build release candidate
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@bbbb8c9ab609f9ab643834ffe948a0f577bc4c0c # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/Morphant.slnx -p:MorphantRoslynVersion=4.4.0

      - name: Build
        run: >-
          dotnet build src/Morphant.slnx
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:MorphantRoslynVersion=4.4.0

      - name: Test generator
        run: >-
          dotnet test src/tests/Morphant.Generator.UnitTests/Morphant.Generator.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore
          -p:MorphantRoslynVersion=4.4.0
          --results-directory artifacts/test-results/unit
          --logger "trx;LogFileName=unit.trx"

      - name: Test integration scenarios
        run: >-
          dotnet test src/tests/Morphant.Generator.IntegrationTests/Morphant.Generator.IntegrationTests.csproj
          --configuration Release
          --no-build
          --no-restore
          -p:MorphantRoslynVersion=4.4.0
          --results-directory artifacts/test-results/integration
          --logger "trx;LogFileName=integration.trx"

      - name: Pack release candidate
        run: >-
          dotnet pack src/Morphant/Morphant.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/packages
          -p:ContinuousIntegrationBuild=true
          -p:MorphantRoslynVersion=4.4.0

      - name: Record package hashes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        working-directory: artifacts/packages
        run: >-
          sha256sum
          "Morphant.$VERSION.nupkg"
          "Morphant.$VERSION.snupkg"
          > SHA256SUMS

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-results-ubuntu
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 30

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          path: |
            artifacts/packages/Morphant.${{ needs.preflight.outputs.version }}.nupkg
            artifacts/packages/Morphant.${{ needs.preflight.outputs.version }}.snupkg
            artifacts/packages/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  roslyn-compatibility:
    name: Validate Roslyn 4.9.2
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@bbbb8c9ab609f9ab643834ffe948a0f577bc4c0c # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: >-
          dotnet restore src/tests/Morphant.Generator.UnitTests/Morphant.Generator.UnitTests.csproj
          -p:MorphantRoslynVersion=4.9.2

      - name: Test
        run: >-
          dotnet test src/tests/Morphant.Generator.UnitTests/Morphant.Generator.UnitTests.csproj
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:MorphantRoslynVersion=4.9.2

  cross-platform:
    name: Validate release (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@bbbb8c9ab609f9ab643834ffe948a0f577bc4c0c # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/Morphant.slnx -p:MorphantRoslynVersion=4.4.0

      - name: Build
        run: >-
          dotnet build src/Morphant.slnx
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:MorphantRoslynVersion=4.4.0

      - name: Test generator
        run: >-
          dotnet test src/tests/Morphant.Generator.UnitTests/Morphant.Generator.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore
          -p:MorphantRoslynVersion=4.4.0

      - name: Test integration scenarios
        run: >-
          dotnet test src/tests/Morphant.Generator.IntegrationTests/Morphant.Generator.IntegrationTests.csproj
          --configuration Release
          --no-build
          --no-restore
          -p:MorphantRoslynVersion=4.4.0

  minimum-sdk-package-consumer:
    name: Validate release package (.NET SDK 7.0.100 / MSBuild 17.4)
    needs:
      - preflight
      - package
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up minimum .NET SDK
        uses: actions/setup-dotnet@bbbb8c9ab609f9ab643834ffe948a0f577bc4c0c # v6
        with:
          dotnet-version: 7.0.100

      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          path: artifacts/release-candidate

      - name: Build and run with the minimum SDK host
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        working-directory: src/tests/Morphant.Generator.PackageTests.MinimumSdkConsumer
        run: |
          test "$(dotnet --version)" = "7.0.100"
          dotnet run \
            --configuration Release \
            -m:1 \
            -nodeReuse:false \
            -p:MorphantTestPackageVersion="$VERSION" \
            -p:MorphantGitSnapshot=true \
            -p:RestoreSources="${{ github.workspace }}/artifacts/release-candidate" \
            -p:NuGetAudit=false
          test -n "$(find Generated/Morphant/net7.0 -maxdepth 1 -name 'Morphant.Generated.TypeMapper.*.g.cs' -print -quit)"

  publish:
    name: Publish to NuGet
    needs:
      - preflight
      - package
      - roslyn-compatibility
      - cross-platform
      - minimum-sdk-package-consumer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: nuget.org
      url: https://www.nuget.org/packages/Morphant/${{ needs.preflight.outputs.version }}
    permissions:
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up .NET
        uses: actions/setup-dotnet@bbbb8c9ab609f9ab643834ffe948a0f577bc4c0c # v6
        with:
          global-json-file: global.json

      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          path: artifacts/release-candidate

      - name: Verify package hashes
        working-directory: artifacts/release-candidate
        run: sha256sum --check SHA256SUMS

      - name: Validate existing release state
        id: release_state
        env:
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
          VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          tag="v$VERSION"
          tag_exists=false

          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            tag_exists=true
            existing_commit="$(git rev-list -n 1 "$tag")"

            if [[ "$existing_commit" != "$RELEASE_COMMIT" ]]; then
              echo "$tag already points to $existing_commit instead of $RELEASE_COMMIT." >&2
              exit 1
            fi
          fi

          normalized_version="${VERSION,,}"
          package_exists="$(
            curl --fail --silent --show-error --retry 3 --retry-all-errors \
              https://api.nuget.org/v3-flatcontainer/morphant/index.json |
              jq --arg version "$normalized_version" \
                'any(.versions[]; ascii_downcase == $version)'
          )"

          if [[ "$package_exists" != "true" && "$package_exists" != "false" ]]; then
            echo "Could not determine whether Morphant $VERSION exists on NuGet.org." >&2
            exit 1
          fi

          if [[ "$package_exists" == "true" && "$tag_exists" != "true" ]]; then
            echo "Morphant $VERSION already exists on NuGet.org, but $tag does not exist." >&2
            echo "Refusing to create a tag for a package whose contents cannot be verified." >&2
            exit 1
          fi

          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"
          echo "package_exists=$package_exists" >> "$GITHUB_OUTPUT"

      - name: Validate NuGet API key
        if: steps.release_state.outputs.package_exists != 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "The release workflow has no NUGET_API_KEY secret." >&2
            exit 1
          fi

      - name: Create release tag
        if: steps.release_state.outputs.tag_exists != 'true'
        env:
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
          VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          tag="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" "$RELEASE_COMMIT" --message "Morphant $VERSION"
          git push origin "refs/tags/$tag"

      - name: Publish package
        if: steps.release_state.outputs.package_exists != 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: >-
          dotnet nuget push
          "artifacts/release-candidate/Morphant.$VERSION.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --timeout 600

  github-release:
    name: Create GitHub release
    needs:
      - preflight
      - package
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}

      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          path: artifacts/release-candidate

      - name: Prepare release notes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          awk -v heading="## [$VERSION]" '
            $0 == heading { capture = 1; next }
            capture && /^## / { exit }
            capture && /^\[[^]]+\]:/ { exit }
            capture { print }
          ' CHANGELOG.md > artifacts/release-notes.md

          if [[ ! -s artifacts/release-notes.md ]]; then
            echo "CHANGELOG.md has no release notes for $VERSION." >&2
            exit 1
          fi

          tag="v$VERSION"
          sed -i "s#](docs/#](https://github.com/$GITHUB_REPOSITORY/blob/$tag/docs/#g" artifacts/release-notes.md

      - name: Create release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          tag="v$VERSION"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/release-candidate/* --clobber
            exit 0
          fi

          gh release create "$tag" \
            artifacts/release-candidate/* \
            --verify-tag \
            --title "Morphant $VERSION" \
            --notes-file artifacts/release-notes.md
