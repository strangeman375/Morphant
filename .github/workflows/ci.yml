name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  validation:
    uses: ./.github/workflows/validation.yml
    with:
      cross-platform: ${{ github.event_name != 'pull_request' }}

  minimum-sdk-package-consumer:
    name: Package consumer (.NET SDK 7.0.100 / MSBuild 17.4)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up current and minimum .NET SDKs
        uses: actions/setup-dotnet@349aa191ae05aee6d53db4bcba37bd6980e812fe # v6
        with:
          global-json-file: global.json
          dotnet-version: 7.0.100

      - name: Build package with the current SDK
        run: |
          dotnet restore src/Morphant/Morphant.csproj
          dotnet build src/Morphant/Morphant.csproj \
            --configuration Release \
            --no-restore \
            -p:ContinuousIntegrationBuild=true
          dotnet pack src/Morphant/Morphant.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            --output artifacts/minimum-sdk-packages \
            -p:PackageVersion=0.0.0-minimum-sdk.${{ github.run_id }}

      - name: Build and run with the minimum SDK host
        run: >-
          bash eng/test-minimum-sdk-package.sh
          "0.0.0-minimum-sdk.${{ github.run_id }}"
          artifacts/minimum-sdk-packages

  publish-coverage-badge:
    name: Publish coverage badge
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - validation
      - minimum-sdk-package-consumer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out badge branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: badges

      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: artifacts/coverage

      - name: Publish badge
        shell: bash
        run: |
          badge_path="artifacts/coverage/badge_linecoverage.svg"
          report_path="artifacts/coverage/SummaryGithub.md"

          if [[ ! -f "$badge_path" ]]; then
            echo "Coverage badge was not generated: $badge_path" >&2
            exit 1
          fi

          if [[ ! -f "$report_path" ]]; then
            echo "Coverage summary was not generated: $report_path" >&2
            exit 1
          fi

          cp "$badge_path" coverage.svg
          cp "$report_path" coverage.md

          {
            printf '\n---\n\n'
            printf 'Full HTML report: download the **coverage** artifact from [CI run #%s](https://github.com/%s/actions/runs/%s).\n' \
              "$GITHUB_RUN_NUMBER" \
              "$GITHUB_REPOSITORY" \
              "$GITHUB_RUN_ID"
          } >> coverage.md

          git add coverage.svg coverage.md

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update coverage badge for $GITHUB_SHA"
          git push origin HEAD:badges
